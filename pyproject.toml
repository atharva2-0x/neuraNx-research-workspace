[project]
name = "fund-evidence"
version = "0.1.0"
description = "Traceable financial document intelligence for the ABC Company Fund"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1",
  "pdfplumber>=0.11,<1", "python-multipart>=0.0.20,<1",
  "httpx>=0.28,<1", "sqlalchemy>=2.0,<3", "python-dotenv>=1,<2",
  "psycopg[binary]>=3.2,<4", "pgvector>=0.4,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
fast-pdf = ["pymupdf>=1.25,<2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

