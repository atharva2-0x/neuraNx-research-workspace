services:
  app:
    build: .
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://fund:fund-local@db:5432/fund
      DATA_DIR: /app/data
      ENABLE_LLM: ${ENABLE_LLM:-true}
      ENABLE_EMBEDDINGS: ${ENABLE_EMBEDDINGS:-true}
      # Provider selection
      LLM_PROVIDER: ${LLM_PROVIDER:-anthropic}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-local}
      # Anthropic
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_MODEL: ${ANTHROPIC_MODEL:-claude-haiku-4-5}
      # OpenAI
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4.1-mini}
      OPENAI_EMBEDDING_MODEL: ${OPENAI_EMBEDDING_MODEL:-text-embedding-3-small}
      OPENAI_EMBEDDING_DIM: ${OPENAI_EMBEDDING_DIM:-1536}
      # Local embeddings
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-BAAI/bge-small-en-v1.5}
      EMBEDDING_DIM: ${EMBEDDING_DIM:-384}
    volumes:
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 3
  db:
    image: pgvector/pgvector:pg16
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      POSTGRES_DB: fund
      POSTGRES_USER: fund
      POSTGRES_PASSWORD: fund-local
    volumes:
      - fund-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fund -d fund"]
      interval: 5s
      timeout: 5s
      retries: 10
volumes:
  fund-postgres:
